<link rel="icon" href="data:,">

if (made >= 2 && !grudged) Y.joy = Math.min(100, Y.joy + 1);
Y.log = Y.log.concat(log);

if (Y.daysLeft <= 0) { startEve(); return; }

function krampusDay(log) {
const bell = Y.crew.some(e => e.job === "bell" && !Y.quitters.includes(e.id));
const ward = Y.wardOk && Y.crew.some(e => e.job === "ward" && !Y.quitters.includes(e.id));
Y.wardOk = ward;

} else if (Y.day === 11) {
startKrampus("raid");

Y.belief = Math.max(0, Y.belief - Math.round(BALANCE.raidBelief * resist));
for (const e of Y.crew) {
if (Y.quitters.includes(e.id)) continue;
e.joy = Math.max(0, e.joy - drain);
e.belief = Math.max(0, e.belief - Math.round(7 * resist));

}
function startEve() {

function eveAdvance() {

function finishEve() {

const reasons = [];
let pts = 0;
if (Y.delivered >= Y.quota) { pts += 3; reasons.push("Quota met (" + Y.delivered + "/" + Y.quota + " toys)."); }
else reasons.push("Short of quota (" + Y.delivered + "/" + Y.quota + " toys).");
if (Y.joy >= BALANCE.joyKeep) { pts += 1; reasons.push("The hall kept its joy."); } else reasons.push("Joy ended low (" + Y.joy + ").");

function workshopRect() {

}
function crewSlots() {
const n = Y.crew.length, W = ST.BW, wr = workshopRect();
const y = wr.y + wr.h + 3, h = Math.max(28, ST.BH - y - 2), w = Math.floor(W / n);

}
function wrToBuf(u, v) {

}
function bufToStation(bx, by) {

}
function crewHit(bx, by) {
for (const s of crewSlots()) if (bx >= s.x && bx <= s.x + s.w && by >= s.y && by <= s.y + s.h) return s.id;

}
function tryAssign(sid) {

ST.sfx && ST.sfx("assign");
showBanner(e.name + " → " + (station(sid) || { name: sid }).name, "info", 1.4);
}
function clickBuf(bx, by) {

function applyMove(dt) {

cursor.x += (d.x || 0) * SPEED * dt;
cursor.y += (d.y || 0) * SPEED * dt;

function spriteFor(e) {

if (e.tired >= 7) return IMG.moodTired;
if (adjacentGrudge() && (e.grudge || elf("bram") && elf("nim"))) { /* pip not in the grudge */ }
if (e.belief < 40) return IMG.moodDoubt;
if (e.tired >= 5) return IMG.moodTired;

}
if (e.belief < 40 && IMG[e.id]) return IMG[e.id];
return IMG[e.id];
}
function moodOf(e) {

if (e.belief < 40) return "doubt";
if (e.tired >= 7) return "tired";
if (adjacentGrudge() && (e.id === "bram" || e.id === "nim")) return "grumpy";
if (e.tired >= 5) return "tired";

}
function drawSprite(g, img, feet, height, facing, bob, tint) {

const h = height, w = h * (img.width / img.height);

if (facing < 0) { g.translate(p.x, 0); g.scale(-1, 1); g.translate(-p.x, 0); }
g.drawImage(img, dx, dy, w, h);

function drawFootprints(g) {
const wr = workshopRect();

const pts = [[0.45, 0.28], [0.48, 0.32], [0.46, 0.36], [0.49, 0.40], [0.47, 0.44]];

}
const GAME = {

saveDefaults: { bestGrade: "", plays: 0 },
saveState: {

},
song: () => "workshop",
mood: () => {

},
start() {

},
update(dt) {

},
draw() {

}
